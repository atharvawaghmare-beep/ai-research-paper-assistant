[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fullstack-starter-backend"
version = "0.1.0"
description = "FastAPI backend for a Vite + React full-stack starter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.4,<3.0",
  "email-validator>=2.2,<3.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "PyJWT>=2.9,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "alembic>=1.13,<2.0",
  "sentence-transformers>=3.0,<4.0",
  "faiss-cpu>=1.8,<2.0",
  "rank-bm25>=0.2,<1.0",
  "httpx>=0.27,<1.0",
  "slowapi>=0.1,<1.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]